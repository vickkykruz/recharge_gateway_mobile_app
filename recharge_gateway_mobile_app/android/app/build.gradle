android {
    namespace = "com.example.recharge_gateway_mobile_app"
    compileSdk = 34
    ndkVersion = "25.1.8937393"

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.example.health_app"
        minSdkVersion = 21  // Example value; adjust to your needs
        targetSdkVersion = 34  // Align with compileSdk
        versionCode = 1
        versionName = "1.0"
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

apply from: "/home/victor/flutter/packages/flutter_tools/gradle/flutter.gradle"

